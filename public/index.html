button{font:inherit;font-size:11px;background:var(--c);color:#111;border:4px solid #000;box-shadow:4px 4px 0 #000;padding:12px 16px;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s}

.sc b{font-size:20px;display:block;color:var(--c)}

.mid{text-align:center;border-color:var(--c)}

.q{color:var(--c);margin:12px 0;font-size:12px}

document.addEventListener('pointerdown',()=>{if(snd)ac()});
function beep(f,d){if(!snd)return;const x=ac();if(!x)return;try{const o=x.createOscillator(),g=x.createGain();o.frequency.value=f;o.type='square';g.gain.value=.04;o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+d)}catch(e){}}
const sndUi=()=>{const b=$('#snd');b.textContent=snd?'🔊':'🔇';b.title=snd?'Sonido activado (clic para silenciar)':'Sonido silenciado (clic para activar)'};
sndUi();
$('#snd').onclick=()=>{snd=!snd;try{localStorage.setItem('epjs',snd?'1':'0')}catch(e){}sndUi();beep(660,.12)};
$('#rmb').onclick=()=>document.body.classList.toggle('rm');

function scoreRound(lv,ans,fee){
  const p=LV[lv].p, e=ans.map(a=>Math.round(a*1e6)), f=Math.round(fee*1e6), d=e.map(x=>Math.abs(x-f)), ex=d.map(x=>x===0), pts=[0,0];
  if(ex.some(Boolean)) ex.forEach((x,i)=>{if(x)pts[i]=p[1]});
  else{ const m=Math.min(...d); d.forEach((x,i)=>{if(x===m)pts[i]=p[0]}); }
  return {pts, ex, d:d.map(x=>x/1e6)};
}

function round(r){
  const lv=S.lv;
  if(r===10){
    const q=S.specialSq || SQ[lv][0];
    return {k:'sq', head:'VALOR DE PLANTILLA', title:q[0], sub:q[1]+' · '+q[2]+' · '+q[4]+' jugadores (primer equipo)', q:'¿Cuál es el valor de mercado total de la plantilla?', v:q[3], e:q[5], note:est(q[5],'Valor de mercado, no gasto en fichajes.'), src:q[6]||link(q[0])};
  }
  if(r===20){
    const q=S.specialSa || SA[lv][0];
    return {k:'sal', head:'SALARIO ANUAL', title:q[0], sub:q[1]+' · '+q[2], q:'¿CUÁNTO GANA AL AÑO?', v:q[3], e:q[5], note:est(q[5],q[4]), src:q[6]||link(q[0]+' salary')};
  }
  const i = r < 10 ? r-1 : r < 20 ? r-2 : r-3;
  const tIndex = S.ord ? S.ord[i] : i;
  const t = TP[lv][tIndex];
  return {k:'tr', head:'TRASPASO · '+t.s, title:t.n, from:t.f, to:t.t, q:'¿CUÁNTO COSTÓ EL FICHAJE?', v:t.v, e:t.e, p:t.p, note:est(t.e,''), src:t.u||link(t.n)};
}

function menu(){
  if(RM){RM.close();RM=null;clearInterval(hb)}
  S=null;
  const sv=load();
  A.style.setProperty('--c','#ffd93d');
  A.innerHTML=`<div class="wrap"><h1>EL PRECIO<br>JUSTO</h1>
  <div class="row">${[1].map(i=>`<div class="card pl" style="animation-delay:${i*.15}s"><span class="tag">TU NOMBRE</span><input type="text" id="n${i}" maxlength="14" placeholder="" value="${esc(sv&&sv.names&&!/^Jugador \d$|^Esperando/.test(sv.names[sv.me||0])?sv.names[sv.me||0]:'')}"></div>`).join('')}</div>
  <div style="text-align:center;margin:26px 0"><button class="big" id="onl">▶ JUGAR ONLINE</button>${sv&&sv.on&&sv.r&&!sv.done?'<p><button id="cont">CONTINUAR PARTIDA ('+LV[sv.lv].n+' '+sv.r+'/28)</button></p>':''}<p><button id="clr" style="--c:#999;font-size:9px">🧹 BORRAR CACHÉ DE IMÁGENES</button><br><span id="cinfo" class="sm"></span></p></div></div><div class="pitch"></div>${foot}`;

  if($('#cont'))$('#cont').onclick=()=>{S=sv;if(S.on)net();game()};
  $('#onl').onclick=()=>{beep(440,.1);online($('#n1').value.trim()||'Jugador')};
  const mb=b=>(b/1048576).toFixed(1).replace('.',',')+' MB';
  fetch('/cache/info').then(r=>r.json()).then(i=>{const e=$('#cinfo');if(e)e.textContent='Caché: '+i.archivos+' imágenes · '+mb(i.bytes)}).catch(()=>{});
  $('#clr').onclick=()=>{if(!confirm('¿Borrar las imágenes guardadas? Se volverán a descargar cuando hagan falta.'))return;
    fetch('/cache/borrar',{method:'POST'}).then(r=>r.json()).then(i=>{$('#cinfo').textContent=i.error?i.error:'Borradas '+i.borradas+' imágenes ('+mb(i.bytes)+')'}).catch(()=>{$('#cinfo').textContent='No se pudo borrar'})}
}

function difficulty(n,on){
  A.innerHTML=`<div class="wrap"><h1 style="font-size:20px">ELIGE DIFICULTAD</h1><div class="row">${Object.keys(LV).map(k=>`<div class="card diff" style="--c:${LV[k].c}"><h2>${LV[k].n}</h2><p class="sm">${LV[k].d}<br>28 rondas<br>Cercano +${LV[k].p[0]} · Exacto +${LV[k].p[1]}</p><button data-k="${k}" style="--c:${LV[k].c}">COMENZAR</button></div>`).join('')}</div>
  <p style="text-align:center"><button id="bk" style="--c:#999">← VOLVER</button></p></div><div class="pitch"></div>${foot}`;
  let mode='s';$('#bk').onclick=menu;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    beep(520,.1);
    const generated = pickGameQuestions(b.dataset.k);
    S={
      names:n, mode:on?'s':mode, on:on?1:0, code:on?Math.random().toString(36).slice(2,6).toUpperCase():'',
      me:0, g:0, ord:generated.trIndices, specialSq:generated.specialSq, specialSa:generated.specialSa,
      lv:b.dataset.k, r:1, sc:[0,0], st:[{w:0,ex:0,dd:0,cur:0,best:0},{w:0,ex:0,dd:0,cur:0,best:0}],
      ans:[null,null], step:0, rev:false, res:null, n:0
    };
    save(); if(on)net(); game();
  });
}

function game(){
  const L=LV[S.lv], r=S.r, q=round(r);
  A.style.setProperty('--c',L.c);
  const hd=`<div class="top"><div class="sc" id="s0">${esc(S.names[0])}<b>${S.sc[0]}</b></div><div class="sc" style="flex:.8">${r}/28<br>${S.on?'<span class="sm">SALA '+S.code+'</span><br>':''}<span class="sm" style="color:${L.c}">${L.n}</span></div><div class="sc" id="s1">${esc(S.names[1])}<b>${S.sc[1]}</b></div></div>`;
  
  let mid=`<div class="card mid ${q.k!=='tr'?'sp':''}"><div class="sm">${q.head}</div>`;
  if(q.k==='sq'){
    mid+=`<div class="team-badge cr-big">${getTeamBadgeHtml(q.title)}${im(imgC(q.title),'',q.title)}</div><div class="ph" style="width:auto;height:auto;padding:12px;border-radius:8px;font-size:14px">${esc(q.title)}</div><div class="sm">${esc(q.sub)}</div>`;
  } else {
    mid+=`<div class="ph">${ini(q.title)}${im(imgP(q.title),q.p,q.title)}</div><div style="font-size:15px;margin:6px 0">${esc(q.title)}</div>`;
    if(q.k==='tr'){
      mid+=`<div class="transfer-container">
        <div class="team-box"><div class="team-badge">${getTeamBadgeHtml(q.from)}${im(imgC(q.from),'',q.from)}</div><span class="badge">${esc(q.from)}</span></div>
        <span class="ar">→</span>
        <div class="team-box"><div class="team-badge">${getTeamBadgeHtml(q.to)}${im(imgC(q.to),'',q.to)}</div><span class="badge">${esc(q.to)}</span></div>
      </div>`;
    } else {
      mid+=`<div class="sm">${esc(q.sub)}</div>`;
    }
  }
  mid+=`<div class="q">${q.q}</div><div class="sm">Responde en M€ (millones de euros)</div>${S.rev?'':'<div class="sm" style="opacity:.75">'+esc(q.note)+'</div>'}`;
  if(S.rev){const x=S.res;mid+=`<div class="big2" id="cnt">0 M€</div><div class="sm">${esc(q.note)}<br><a href="${q.src}" target="_blank" rel="noopener">Consultar fuente</a></div>`}
  mid+='</div>';

  let pan='<div class="pan">';
  for(let i=0;i<2;i++){
    const hidden=!S.rev&&((S.mode==='t'&&S.step!==i&&S.ans[i]===null)||(S.on&&i!==S.me&&S.ans[i]===null));
    pan+=`<div class="card" id="p${i}"><b>${esc(S.names[i])}</b><br>`;
    if(S.rev){
      const x=S.res;
      pan+=`<p>Respuesta: ${fmt(S.ans[i])}<br>Diferencia: ${fmt(x.d[i])}<br><span class="ok">${x.ex[i]?'¡PRECIO EXACTO! ':x.pts[i]?'¡PRECIO MÁS CERCANO! ':''}</span>Puntos: +${x.pts[i]}</p>`;
    } else if(S.ans[i]!==null){
      pan+='<p class="ok">✔ '+fmt(S.ans[i])+'</p>';
    } else if(hidden){
      pan+='<p class="sm">Espera tu turno…</p>';
    } else {
      pan+=`<input type="password" inputmode="decimal" id="in${i}" placeholder="Tu respuesta en M€" autocomplete="off"><button id="ok${i}" style="margin-top:8px">CONFIRMAR</button><p class="sm" id="er${i}"></p>`;
    }
    pan+='</div>';
  }
  pan+='</div>';

  const both=S.ans[0]!==null&&S.ans[1]!==null;
  let act='<div style="text-align:center;margin-top:16px">';
  if(S.rev) act+=`<button id="nx">${r===28?'VER RESULTADO FINAL':'SIGUIENTE RONDA ▶'}</button>`;
  else if(both) act+='<button id="rv">REVELAR PRECIO</button>';
  
  act+=` <button id="newgame" style="--c:#ff9800">🔄 NUEVA PARTIDA</button> <button id="mn" style="--c:#999">MENÚ</button></div><div class="bar"><i style="width:${(r-(S.rev?0:1))/28*100}%"></i></div>`;
  
  A.innerHTML=`<div class="wrap">${hd}${mid}${pan}${act}</div><div class="pitch"></div>${foot}`;

  for(let i=0;i<2;i++){
    const b=$('#ok'+i);
    if(b){
      const inp=$('#in'+i);
      inp.onkeydown=e=>{if(e.key==='Enter')b.click()};
      b.onclick=()=>{
        const raw=inp.value.trim().replace(/\./g,'').replace(',','.'), v=raw===''?NaN:Number(raw);
        if(!(v>=0)||!isFinite(v)){$('#er'+i).textContent='Introduce un número válido (≥ 0).';return}
        S.ans[i]=v; if(S.mode==='t'&&i===0)S.step=1; save(); send(); beep(500,.08); game();
      };
    }
  }

  if($('#rv'))$('#rv').onclick=reveal;
  if($('#nx'))$('#nx').onclick=()=>{
    beep(400,.1);
    if(r===28){S.done=true;save();send();final()}
    else{S.r++; S.ans=[null,null]; S.step=0; S.rev=false; S.res=null; save(); send(); game();}
  };

  $('#newgame').onclick=()=>{
    if(confirm('¿Deseas abandonar la partida actual y comenzar una nueva con preguntas aleatorias? Se mantendrán tus nombres y dificultad.')){
      beep(520,.1);
      const generated = pickGameQuestions(S.lv);
      S={
        ...S,
        g:(S.g||0)+1,
        ord:generated.trIndices,
        specialSq:generated.specialSq,
        specialSa:generated.specialSa,
        r:1,
        sc:[0,0],
        st:[{w:0,ex:0,dd:0,cur:0,best:0},{w:0,ex:0,dd:0,cur:0,best:0}],
        ans:[null,null],
        step:0,
        rev:false,
        res:null,
        done:false
      };
      save(); send(); game();
    }
  };

  $('#mn').onclick=()=>{if(confirm('¿Volver al menú? Tu partida queda guardada.'))menu()};
  if(S.rev)count(q.v);
}

function reveal(){
  const q=round(S.r), x=scoreRound(S.lv,S.ans,q.v);
  S.res=x; S.rev=true;
  for(let i=0;i<2;i++){
    S.sc[i]+=x.pts[i]; const s=S.st[i]; s.dd+=x.d[i]; if(x.ex[i])s.ex++;
    const w=x.pts[i]>x.pts[1-i];
    if(w){s.w++; s.cur++; s.best=Math.max(s.best,s.cur)} else s.cur=0;
  }
  S.n++; save(); send(); beep(300,.3);
  document.body.style.opacity=.85;
  setTimeout(()=>{
    document.body.style.opacity=1; game();
    for(let i=0;i<2;i++) if(x.pts[i]){
      const e=$('#s'+i); e.classList.add('g');
      e.insertAdjacentHTML('beforeend','<span class="fl">+'+x.pts[i]+(x.pts[i]===1?' PUNTO':' PUNTOS')+'</span>');
      beep(700,.15);
    }
    if(x.pts[0]&&x.pts[0]===x.pts[1])$('#cnt').insertAdjacentHTML('afterend','<div class="ok">¡EMPATE!</div>');
  },400);
}

function count(v){
  const e=$('#cnt'), t0=performance.now(), D=document.body.classList.contains('rm')?1:1400;
  const f=t=>{const p=Math.min(1,(t-t0)/D); e.textContent=fmt(p<1?Math.round(v*p*10)/10:v); if(p<1)requestAnimationFrame(f)};
  requestAnimationFrame(f);
}

function final(){
  const L=LV[S.lv]; A.style.setProperty('--c',L.c);
  const [a,b]=S.sc, w=a===b?'¡EMPATE!':'GANADOR: '+esc(S.names[a>b?0:1]);
  A.innerHTML=`<div class="wrap"><h1 style="font-size:22px">FIN DE LA PARTIDA</h1><div class="card mid"><div class="big2">${w}</div><table><tr><th></th><th>${esc(S.names[0])}</th><th>${esc(S.names[1])}</th></tr>
  <tr><td>Puntos</td><td>${a}</td><td>${b}</td></tr><tr><td>Rondas ganadas</td><td>${S.st[0].w}</td><td>${S.st[1].w}</td></tr><tr><td>Exactas</td><td>${S.st[0].ex}</td><td>${S.st[1].ex}</td></tr><tr><td>Mejor racha</td><td>${S.st[0].best}</td><td>${S.st[1].best}</td></tr>
  <tr><td>Diferencia acumulada</td><td>${fmt(S.st[0].dd)}</td><td>${fmt(S.st[1].dd)}</td></tr><tr><td>Diferencia media</td><td>${fmt(S.st[0].dd/28)}</td><td>${fmt(S.st[1].dd/28)}</td></tr></table>
  <button id="again">VOLVER A JUGAR</button> <button id="m2" style="--c:#999">MENÚ PRINCIPAL</button></div></div><div class="pitch"></div>${foot}`;
  beep(880,.4);
  $('#again').onclick=()=>{
    const generated = pickGameQuestions(S.lv);
    S={...S, g:(S.g||0)+1, ord:generated.trIndices, specialSq:generated.specialSq, specialSa:generated.specialSa, r:1, sc:[0,0], st:[{w:0,ex:0,dd:0,cur:0,best:0},{w:0,ex:0,dd:0,cur:0,best:0}], ans:[null,null], step:0, rev:false, res:null, done:false};
    save(); send(); game();
  };
  $('#m2').onclick=menu;
}

let RM=null, hb=null;
function prog(s){return(s.g||0)*1e5+s.r*10+(s.rev?5:0)+(s.done?9:0)}
let CID=Math.random().toString(36).slice(2);
async function net(){
  try{
    RM=new EventSource('/events?room='+S.code);
    RM.onmessage=e=>{const m=JSON.parse(e.data); if(m.cid!==CID)merge(m.data)};
  }catch(e){RM=null; alert('No se pudo conectar al servidor.'); return}
  clearInterval(hb); hb=setInterval(send,2500); send();
}
function send(){if(RM&&S&&S.on)fetch('/emit?room='+S.code,{method:'POST',body:JSON.stringify({cid:CID,data:S})}).catch(()=>{})}
function merge(R){
  if(!S||!S.on||!R||R.code!==S.code||R.me===S.me)return;
  const me=S.me, o=1-me, nm=S.names[me]; let ch=false;
  if(prog(R)>prog(S)){Object.assign(S,JSON.parse(JSON.stringify(R)),{me}); ch=true}
  else if(R.r===S.r&&!S.rev&&!R.rev&&(S.g||0)===(R.g||0)){for(let i=0;i<2;i++)if(S.ans[i]===null&&R.ans[i]!==null){S.ans[i]=R.ans[i]; ch=true}}
  S.names[me]=nm; if(R.names[o]&&R.names[o]!=='Esperando…'&&S.names[o]!==R.names[o]){S.names[o]=R.names[o]; ch=true}
  if(ch&&S.r){save(); const v=$('#in'+me), t=v?v.value:''; S.done?final():game(); const w=$('#in'+me); if(w)w.value=t;}
}
function online(nm){
  A.innerHTML=`<div class="wrap"><h1 style="font-size:18px">JUGAR ONLINE</h1><div class="card mid"><button id="cr">CREAR SALA</button><p class="sm">o únete con el código de tu rival:</p><input type="text" id="cd" maxlength="4" placeholder="CÓDIGO" style="text-transform:uppercase"><button id="jn" style="margin-top:8px">UNIRSE</button></div><p style="text-align:center"><button id="bk" style="--c:#999">← VOLVER</button></p></div><div class="pitch"></div>${foot}`;
  $('#bk').onclick=menu; $('#cr').onclick=()=>difficulty([nm,'Esperando…'],1);
  $('#jn').onclick=()=>{
    const c=$('#cd').value.trim().toUpperCase(); if(c.length<4)return;
    S={on:1, code:c, me:1, g:0, names:['Esperando…',nm], mode:'s', lv:'f', r:0, sc:[0,0], st:[], ans:[null,null], step:0, rev:false, res:null, n:0};
    net(); A.innerHTML='<div class="wrap"><div class="card mid">Conectando a la sala '+esc(c)+'…</div></div>';
  };
}

menu();
</script></body></html>
